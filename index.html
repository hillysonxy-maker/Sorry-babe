<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Bemthoi</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Prank State */
        #question {
            color: #ff1493;
            font-size: 2rem;
            text-align: center;
            position: absolute;
            top: 15%;
            z-index: 100;
            padding: 0 20px;
            pointer-events: none;
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        #yesBtn { background-color: #28a745; color: white; z-index: 10; }
        #noBtn { background-color: #dc3545; color: white; z-index: 20; }

        /* Success State - Hidden initially */
        #successScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('YOUR_IMAGE_URL_HERE') no-repeat center center;
            background-size: cover;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            z-index: 1000;
        }

        .success-overlay {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            margin: 20px;
        }

        h2 { font-size: 2.5rem; margin: 0; }
        p { font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1 id="question">Please Unblock me Bemthoi</h1>

    <div class="btn-container" id="prankUI">
        <button id="yesBtn">YES</button>
        <button id="noBtn">No</button>
    </div>

    <div id="successScreen">
        <div class="success-overlay">
            <h2>Thank u babe, lets talk now! 😘</h2>
            <p>Now come here you! 😉</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const prankUI = document.getElementById('prankUI');
        const question = document.getElementById('question');
        const successScreen = document.getElementById('successScreen');

        let yesScale = 1;
        let noScale = 1;

        const moveButton = () => {
            // Move No button
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Grow Yes button
            yesScale += 0.6;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Shrink No button
            noScale -= 0.15;
            if (noScale <= 0.1) {
                noBtn.style.display = 'none';
            } else {
                noBtn.style.transform = `scale(${noScale})`;
            }
        };

        // Desktop hover + Mobile tap support
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        yesBtn.addEventListener('click', () => {
            prankUI.style.display = 'none';
            question.style.display = 'none';
            successScreen.style.display = 'flex';
            
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        });
    </script>
</body>
</html>
